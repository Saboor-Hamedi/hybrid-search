<!-- Create / Ingestion Hub Modal (Bootstrap 5 Native) -->
<div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 620px;">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden; background: #ffffff; height: 540px; display: flex; flex-direction: column;">

      <!-- Title Bar -->
      <div class="d-flex justify-content-between align-items-stretch" style="background: #f9fafb; border-bottom: 1px solid #e5e7eb; height: 38px; flex-shrink: 0;">
        <div style="font-size: 0.7rem; font-weight: 800; color: #6b7280; text-transform: uppercase; letter-spacing: 0.12em; display: flex; align-items: center; gap: 8px; padding-left: 16px;">
          <i class="bi bi-cloud-upload-fill text-primary" style="font-size: 0.9rem;"></i>
          <span>Ingestion Hub</span>
        </div>
        <div class="d-flex">
          <button type="button" class="btn btn-sm text-secondary p-0"
            style="width: 44px; border: none; border-radius: 0; outline: none; box-shadow: none;"
            onclick="minimizePDFModal()" title="Minimize">
            <i class="bi bi-dash"></i>
          </button>
          <button type="button" class="btn-close-win" data-bs-dismiss="modal"
            style="width: 44px; height: 38px; border: none; background-color: transparent; box-shadow: none; border-radius: 0; display: flex; align-items: center; justify-content: center; padding: 0; margin: 0; outline: none;"></button>
        </div>
      </div>

      <!-- Tabs Navigation -->
      <div style="border-bottom: 1px solid #e5e7eb; background: #f9fafb; padding: 0 1rem; flex-shrink: 0;">
        <ul class="nav nav-tabs border-0" id="createModalTabs" role="tablist" style="gap: 0.25rem;">
          <li class="nav-item" role="presentation">
            <button class="hub-tab-btn active" id="tab-text" data-bs-toggle="tab" data-bs-target="#panel-text"
              type="button" role="tab">
              <i class="bi bi-pencil-square me-1"></i> Write Text
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="hub-tab-btn" id="tab-pdf" data-bs-toggle="tab" data-bs-target="#panel-pdf"
              type="button" role="tab">
              <i class="bi bi-file-earmark-pdf me-1"></i> PDF Upload
            </button>
          </li>
        </ul>
      </div>

      <!-- Tab Content — fills remaining height, scrolls internally -->
      <div class="tab-content" style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">

        <!-- ── TAB 1: Write Text (default active) ── -->
        <div class="tab-pane fade show active hub-panel" id="panel-text" role="tabpanel">
          <form id="textInsertForm" method="POST" action="/document/new_post" style="display: flex; flex-direction: column; height: 100%;">
            <input type="hidden" name="q" value="">
            <input type="hidden" name="mode" value="hybrid">

            <div style="flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem;">
              <label class="hub-label">Document Content</label>
              <textarea name="content" id="manualContent" class="form-control hub-textarea"
                placeholder="Write or paste your document content here. It will be embedded and indexed for hybrid search..."></textarea>
              <div class="hub-hint">Min. 20 characters. Content is automatically chunked and embedded.</div>

              <div class="mt-3">
                <label class="hub-label">Language</label>
                <select name="language" class="form-select form-select-sm" style="border-radius: 8px; max-width: 160px; border-color: #e5e7eb;">
                  <option value="en" selected>English</option>
                  <option value="fr">French</option>
                  <option value="de">German</option>
                  <option value="es">Spanish</option>
                  <option value="tr">Turkish</option>
                  <option value="ar">Arabic</option>
                </select>
              </div>
            </div>

            <div class="hub-footer">
              <button type="button" class="btn btn-sm btn-light border px-3" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-sm btn-primary px-4 fw-bold">
                <i class="bi bi-database-add me-1"></i> Index Document
              </button>
            </div>
          </form>
        </div>

        <!-- ── TAB 2: PDF Upload ── -->
        <div class="tab-pane fade hub-panel" id="panel-pdf" role="tabpanel">
          <form id="pdfUploadForm" onsubmit="return false;" style="display: flex; flex-direction: column; height: 100%;">

            <div style="flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem;">
              <!-- Drop Zone -->
              <div id="pdfDropZone" class="hub-dropzone">
                <i class="bi bi-file-earmark-arrow-up text-primary" style="font-size: 2rem;"></i>
                <div class="mt-2 fw-semibold text-dark" style="font-size: 0.9rem;">Drop PDFs here or click to browse</div>
                <div class="text-muted mt-1" style="font-size: 0.75rem;">Supports multiple files — bulk upload enabled</div>
                <input type="file" id="pdfFileInput" accept=".pdf" multiple style="display:none;">
              </div>

              <!-- File List (scrollable, capped height so modal never expands) -->
              <div id="pdfFileListArea" style="display: none; margin-top: 0.75rem;">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span id="fileListSummary" style="font-size: 0.7rem; font-weight: 700; color: #6b7280; letter-spacing: 0.06em;">0 FILES SELECTED</span>
                  <button type="button" class="btn btn-sm btn-link text-danger p-0"
                    onclick="window.clearPDFSelection && clearPDFSelection()" style="font-size: 0.75rem;">Clear All</button>
                </div>
                <div id="fileListItems" style="max-height: 150px; overflow-y: auto; border: 1px solid #f3f4f6; border-radius: 8px; padding: 0.5rem; background: #fafafa;"></div>
              </div>

              <!-- Progress Status -->
              <div id="pdfBulkStatus" style="display: none; margin-top: 0.75rem; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.82rem;">
                <span id="bulkUploadText" class="text-muted">Ready to upload</span>
              </div>
            </div>

            <div class="hub-footer">
              <button type="button" id="pdfCancelBtn" class="btn btn-sm btn-light border px-3"
                onclick="window.clearPDFSelection && clearPDFSelection()">Cancel</button>
              <button type="button" id="pdfStopBtn" class="btn btn-sm btn-warning px-3 fw-bold"
                style="display:none;" onclick="window.stopUploadBatch && stopUploadBatch()">
                <i class="bi bi-stop-circle me-1"></i> Stop
              </button>
              <button type="submit" id="pdfUploadBtn" class="btn btn-sm btn-primary px-4 fw-bold" disabled>
                <i class="bi bi-cloud-upload me-1"></i> Upload & Index
              </button>
            </div>

          </form>
        </div>

      </div><!-- /tab-content -->
    </div>
  </div>
</div>

<style>
/* ── Hub Modal Shared Styles ── */
.hub-tab-btn {
  font-size: 0.78rem; font-weight: 700;
  color: #6b7280; background: transparent;
  border: none; border-radius: 6px 6px 0 0;
  padding: 0.5rem 0.9rem; cursor: pointer;
  transition: color 0.15s;
}
.hub-tab-btn.active {
  color: #2563eb;
  border-bottom: 2px solid #2563eb;
}
.hub-tab-btn:hover:not(.active) {
  color: #374151; background: #efefef;
}

/* Each panel fills the available height exactly */
.hub-panel {
  height: 100%;
  display: none;
  flex-direction: column;
}
.hub-panel.show.active {
  display: flex;
}

/* Fixed footer always at the bottom */
.hub-footer {
  display: flex; justify-content: flex-end; gap: 0.5rem;
  padding: 0.85rem 1.5rem;
  border-top: 1px solid #f3f4f6;
  background: #ffffff;
  flex-shrink: 0;
}

/* Textarea fills available space */
.hub-textarea {
  width: 100%;
  min-height: 200px !important;
  max-height: 340px;
  resize: vertical;
  font-size: 0.85rem;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
  line-height: 1.6;
}

.hub-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 700;
  color: #374151;
  margin-bottom: 0.4rem;
}

.hub-hint {
  font-size: 0.72rem;
  color: #9ca3af;
  margin-top: 4px;
}

.hub-dropzone {
  border: 2px dashed #e5e7eb;
  border-radius: 10px;
  background: #fafafa;
  padding: 2rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.hub-dropzone:hover {
  border-color: #2563eb;
  background: #eff6ff;
}

/* File list items */
.file-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.4rem 0.5rem; border-radius: 6px;
  border-left: 4px solid #e5e7eb; margin-bottom: 4px;
  background: white; font-size: 0.8rem; transition: all 0.2s;
}
.file-info { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.file-progress-mini { width: 56px; height: 4px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
.file-progress-inner { height: 100%; width: 0; background: #2563eb; transition: width 0.3s; }
.status-badge { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.badge-queued    { background: #f3f4f6; color: #6b7280; }
.badge-uploading { background: #fef9c3; color: #b45309; }
.badge-success   { background: #dcfce7; color: #15803d; }
.badge-error     { background: #fee2e2; color: #b91c1c; }
</style>

<script>
function minimizePDFModal() {
  const el = document.getElementById('createModal');
  if (el && window.bootstrap) bootstrap.Modal.getOrCreateInstance(el).hide();
}

// Handle Text Submission via AJAX
document.getElementById('textInsertForm')?.addEventListener('submit', async function(e) {
  const ta = document.getElementById('manualContent');
  const content = ta?.value?.trim() ?? '';
  
  if (content.length < 20) {
    e.preventDefault();
    ta.focus();
    ta.style.borderColor = '#ef4444';
    setTimeout(() => { ta.style.borderColor = '#e5e7eb'; }, 2000);
    return;
  }

  // Intercept normal submission
  e.preventDefault();
  const form = this;
  const submitBtn = form.querySelector('button[type="submit"]');
  const originalHtml = submitBtn.innerHTML;
  
  try {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Indexing...';

    const formData = new FormData(form);
    const response = await fetch(form.action, {
      method: "POST",
      body: formData,
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    });

    const result = await response.json();

    if (result.success) {
      // Clear form
      ta.value = '';
      
      // Close Modal
      const modalEl = document.getElementById('createModal');
      bootstrap.Modal.getOrCreateInstance(modalEl).hide();

      // Show Success Toast
      if (window.Notify) {
        window.Notify.show(`Document <strong>#${result.doc_id}</strong> indexed successfully.`, 'success');
      }
    } else {
      throw new Error(result.error || "Insertion failed");
    }
  } catch (err) {
    if (window.Notify) window.Notify.show(`Error: ${err.message}`, 'danger');
    else alert(`Error: ${err.message}`);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalHtml;
  }
});
</script>
