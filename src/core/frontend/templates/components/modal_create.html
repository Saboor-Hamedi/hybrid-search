<!-- Create / Ingestion Hub Modal (Bootstrap 5 Native) -->
<div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" id="createModalDialog" style="max-width: 620px;">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden; background: #ffffff;">

      <!-- Title Bar -->
      <div class="d-flex justify-content-between align-items-stretch" style="background: #f9fafb; border-bottom: 1px solid #e5e7eb; height: 38px; flex-shrink: 0;">
        <div style="font-size: 0.7rem; font-weight: 800; color: #6b7280; text-transform: uppercase; letter-spacing: 0.12em; display: flex; align-items: center; gap: 8px; padding-left: 16px;">
          <i class="bi bi-cloud-upload-fill text-primary" style="font-size: 0.9rem;"></i>
          <span>Ingestion Hub</span>
        </div>
        <div class="d-flex">
          <button type="button" class="btn btn-sm text-secondary p-0"
            style="width: 44px; border: none; border-radius: 0; outline: none; box-shadow: none;"
            onclick="window.minimizeCreateModal && minimizeCreateModal()" title="Minimize">
            <i class="bi bi-dash"></i>
          </button>
          <button type="button" class="btn-close-win" data-bs-dismiss="modal"
            style="width: 44px; height: 38px; border: none; background-color: transparent; box-shadow: none; border-radius: 0; display: flex; align-items: center; justify-content: center; padding: 0; margin: 0; outline: none;"></button>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="modal-body p-4" id="createModalBody" style="min-height: 400px;">
        <form id="pdfUploadForm" onsubmit="return false;">

          <!-- Drop Zone -->
          <div id="pdfDropZone" style="border: 2px dashed #e5e7eb; border-radius: 10px; background: #fafafa; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.2s ease; margin-bottom: 1rem;">
            <i class="bi bi-file-earmark-arrow-up text-primary" style="font-size: 2rem;"></i>
            <div class="mt-2 fw-semibold text-dark" style="font-size: 0.95rem;">Drop PDFs here or click to browse</div>
            <div class="text-muted mt-1" style="font-size: 0.78rem;">Supports multiple files — bulk upload enabled</div>
            <input type="file" id="pdfFileInput" accept=".pdf" multiple style="display:none;">
          </div>

          <!-- File List -->
          <div id="pdfFileListArea" style="display: none; margin-bottom: 1rem;">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span id="fileListSummary" class="fw-bold text-muted" style="font-size: 0.7rem; letter-spacing: 0.08em;">0 FILES SELECTED</span>
              <button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="window.clearPDFSelection && clearPDFSelection()" style="font-size: 0.75rem;">Clear All</button>
            </div>
            <div id="fileListItems" style="max-height: 180px; overflow-y: auto; border: 1px solid #f3f4f6; border-radius: 8px; padding: 0.5rem; background: #fafafa;"></div>
          </div>

          <!-- Progress Status Bar -->
          <div id="pdfBulkStatus" style="display: none; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.82rem;">
            <span id="bulkUploadText" class="text-muted">Ready to upload</span>
          </div>

          <!-- Action Buttons -->
          <div class="d-flex gap-2 justify-content-end">
            <button type="button" id="pdfCancelBtn" class="btn btn-sm btn-light border px-3" onclick="window.clearPDFSelection && clearPDFSelection()">Cancel</button>
            <button type="button" id="pdfStopBtn" class="btn btn-sm btn-warning px-3 fw-bold" style="display:none;" onclick="window.stopUploadBatch && stopUploadBatch()">
              <i class="bi bi-stop-circle me-1"></i> Stop
            </button>
            <button type="submit" id="pdfUploadBtn" class="btn btn-sm btn-primary px-4 fw-bold" disabled>
              <i class="bi bi-cloud-upload me-1"></i> Upload & Index
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<style>
.file-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.4rem 0.5rem; border-radius: 6px;
  border-left: 4px solid #e5e7eb; margin-bottom: 4px;
  background: white; font-size: 0.8rem; transition: all 0.2s;
}
.file-info { flex: 1; min-width: 0; overflow: hidden; }
.file-progress-mini { width: 60px; height: 4px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
.file-progress-inner { height: 100%; width: 0; background: #2563eb; transition: width 0.3s; }
.status-badge { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.badge-queued   { background: #f3f4f6; color: #6b7280; }
.badge-uploading{ background: #fef9c3; color: #b45309; }
.badge-success  { background: #dcfce7; color: #15803d; }
.badge-error    { background: #fee2e2; color: #b91c1c; }
</style>
