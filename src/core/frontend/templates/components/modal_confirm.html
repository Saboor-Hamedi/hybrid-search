<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true" style="z-index: 20000 !important;">
  <style>
    #confirmModal { z-index: 20001 !important; }
    .modal-backdrop.show:last-of-type { 
        z-index: 19999 !important; 
        backdrop-filter: none !important; /* No double blur on top modal */
        -webkit-backdrop-filter: none !important;
    }
  </style>
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 8px; overflow: hidden; background: #ffffff; border: 1px solid #e5e7eb !important;">
      <!-- Windows-Style Title Bar -->
      <div style="background: #f9fafb; border-bottom: 1px solid #e5e7eb; height: 38px; padding: 0 0 0 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
          <div style="font-size: 0.7rem; font-weight: 800; color: #6b7280; text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 8px;">
              <i class="bi bi-shield-check text-primary" style="font-size: 0.85rem;"></i>
              <span id="confirmModalTitle">Verification</span>
          </div>
          <button type="button" class="btn-close btn-close-win" data-bs-dismiss="modal" style="width: 44px; height: 100%; border: none; background-color: transparent; box-shadow: none; border-radius: 0 8px 0 0;"></button>

        </div>

        <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-light rounded-pill px-3 btn-sm fw-bold border" data-bs-dismiss="modal" style="min-width: 90px; font-size: 0.75rem;">CANCEL</button>
            <button type="button" class="btn btn-primary rounded-pill px-3 btn-sm fw-bold" id="confirmModalBtn" style="min-width: 90px; font-size: 0.75rem;">OKAY</button>
        </div>
      </div>
    </div>
  </div>
</div>
