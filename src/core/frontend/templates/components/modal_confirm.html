<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden;">
      <div class="modal-body text-center p-4">
        <div class="mb-3">
            <i class="bi bi-cloud-upload text-primary" style="font-size: 2.5rem;"></i>
        </div>
        <h5 class="mb-2 fw-bold" id="confirmModalTitle">Upload PDF?</h5>
        <p class="text-muted small mb-4" id="confirmModalMessage">Are you sure you want to upload this file?</p>
        
        <div class="d-flex gap-2 justify-content-center">
            <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary rounded-pill px-4" id="confirmModalBtn">Upload</button>
        </div>
      </div>
    </div>
  </div>
</div>
