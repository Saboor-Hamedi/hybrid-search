<!-- Command Palette Modal -->
<div class="modal fade" id="commandPaletteModal" tabindex="-1" aria-labelledby="commandPaletteLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content command-palette">
            <div class="modal-body p-0">
                <!-- Search Input -->
                <div class="command-search-wrapper">
                    <i class="bi bi-search command-search-icon"></i>
                    <input type="text" id="commandPaletteInput" class="command-search-input"
                        placeholder="Type to search... (Ctrl+K)" autocomplete="off" />
                    <button type="button" class="btn-close command-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>

                <!-- Search Mode Selector (Footer) -->
                <div class="command-footer">
                    <div class="command-mode-selector">
                        <span class="command-footer-label">
                            <i class="bi bi-sliders me-1"></i> Search Mode:
                        </span>
                        <div class="btn-group btn-group-sm" role="group">
                            <input type="radio" class="btn-check" name="commandMode" id="cmdHybrid" value="hybrid"
                                checked>
                            <label class="btn btn-outline-primary" for="cmdHybrid">
                                <i class="bi bi-diagram-3"></i> Hybrid
                            </label>

                            <input type="radio" class="btn-check" name="commandMode" id="cmdSemantic" value="semantic">
                            <label class="btn btn-outline-info" for="cmdSemantic">
                                <i class="bi bi-brain"></i> Semantic
                            </label>

                            <input type="radio" class="btn-check" name="commandMode" id="cmdKeyword" value="keyword">
                            <label class="btn btn-outline-warning" for="cmdKeyword">
                                <i class="bi bi-key"></i> Keyword
                            </label>
                        </div>
                    </div>

                    <div class="command-footer-hint">
                        <kbd>Enter</kbd> to search · <kbd>Esc</kbd> to close
                    </div>
                </div>

                <!-- Quick Results Preview (Optional) -->
                <div id="commandResults" class="command-results d-none">
                    <div class="command-results-header">
                        <small class="text-muted">Quick Preview</small>
                    </div>
                    <div id="commandResultsList" class="command-results-list">
                        <!-- Results will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>

        margin-left: 12px;

    .command-close:hover {
        opacity: 1;

        border-top: 1px solid #e9ecef;
