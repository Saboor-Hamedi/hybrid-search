<!-- Sidebar Filters Component -->
<div class="sidebar-filters sticky-sidebar">
    <div class="mb-4 pb-3">
        <h5 class="mode-title mb-2">Search Insights</h5>
        <button class="btn btn-outline-secondary btn-sm w-100 d-flex align-items-center justify-content-center gap-2" onclick="document.getElementById('settingModal').style.display='flex'">
            <i class="bi bi-sliders"></i> Adjust Preferences
        </button>
    </div>

    <!-- Performance Graph -->
    {% if graph_img %}
    <div class="mt-4 pt-3 border-top">
        <h5 class="mode-title mb-3">Performance</h5>
        <img src="data:image/png;base64,{{ graph_img }}" alt="Query Performance Graph" class="img-fluid rounded" />
    </div>
    {% endif %}
</div>

<script>
    function updatePageSize(size) {
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('page_size', size);
        urlParams.set('page', 1); // Reset to page 1
        window.location.search = urlParams.toString();
    }
</script>
