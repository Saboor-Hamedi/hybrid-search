<!-- Sidebar Filters Component -->
<div class="sidebar-filters sticky-sidebar">
    <!-- Page Size Selector -->
    <div class="mb-4 pb-3 border-bottom">
        <h5 class="mode-title"><i class="bi bi-list-ol me-2"></i> Results per page</h5>
        <select class="form-select form-select-sm" onchange="updatePageSize(this.value)">
            <option value="10" {% if page_size==10 %}selected{% endif %}>10 results</option>
            <option value="25" {% if page_size==25 %}selected{% endif %}>25 results</option>
            <option value="50" {% if page_size==50 %}selected{% endif %}>50 results</option>
            <option value="100" {% if page_size==100 %}selected{% endif %}>100 results</option>
            <option value="500" {% if page_size==500 %}selected{% endif %}>500 results</option>
            <option value="1000" {% if page_size==1000 %}selected{% endif %}>1000 results</option>
        </select>
    </div>

    <h5 class="mode-title"><i class="bi bi-sliders me-2"></i> Search Mode</h5>

    <!-- Mode Selection Radios -->
    <div class="form-check mode-radio mode-selector" data-mode="hybrid">
        <input class="form-check-input" type="radio" name="sidebar_mode_select" id="hybrid" {% if mode=="hybrid"
            %}checked{% endif %} onclick="setMode('hybrid'); document.getElementById('header-search-form').submit();" />
        <label class="form-check-label w-100" for="hybrid">
            <span class="mode-label">Hybrid Search</span>
            <small class="mode-description d-block">Vector + BM25 for maximum relevance</small>
        </label>
    </div>

    <div class="form-check mode-radio mode-selector" data-mode="semantic">
        <input class="form-check-input" type="radio" name="sidebar_mode_select" id="semantic" {% if mode=="semantic"
            %}checked{% endif %}
            onclick="setMode('semantic'); document.getElementById('header-search-form').submit();" />
        <label class="form-check-label w-100" for="semantic">
            <span class="mode-label">Semantic</span>
            <small class="mode-description d-block">Meaning-based (vector) search</small>
        </label>
    </div>

    <div class="form-check mode-radio mode-selector" data-mode="keyword">
        <input class="form-check-input" type="radio" name="sidebar_mode_select" id="keyword" {% if mode=="keyword"
            %}checked{% endif %}
            onclick="setMode('keyword'); document.getElementById('header-search-form').submit();" />
        <label class="form-check-label w-100" for="keyword">
            <span class="mode-label">Keyword (BM25)</span>
            <small class="mode-description d-block">Traditional full-text matching</small>
        </label>
    </div>

    <!-- Performance Graph -->
    {% if graph_img %}
    <div class="mt-4 pt-3 border-top">
        <h5 class="mode-title mb-3"><i class="bi bi-graph-up me-2"></i> Performance</h5>
        <img src="data:image/png;base64,{{ graph_img }}" alt="Query Performance Graph" class="img-fluid rounded"
            style="border-radius: var(--border-radius-sm);" />
    </div>
    {% endif %}
</div>

<script>
    function updatePageSize(size) {
        const urlParams = new URLSearchParams(window.location.search);
        urlParams.set('page_size', size);
        urlParams.set('page', 1); // Reset to page 1
        window.location.search = urlParams.toString();
    }
</script>
