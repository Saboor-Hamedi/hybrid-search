<!-- Sidebar Filters Component -->
<div class="sidebar-filters">
    <h5 class="mode-title"><i class="bi bi-sliders me-2"></i> Search Mode</h5>

    <!-- Mode Selection Radios -->
    <div class="form-check mode-radio px-3 py-2 mode-selector" data-mode="hybrid">
        <input class="form-check-input" type="radio" name="sidebar_mode_select" id="hybrid" {% if mode=="hybrid"
            %}checked{% endif %} />
        <label class="form-check-label" for="hybrid">
            <span class="mode-label">Hybrid Search</span>
            <small class="mode-description">Vector + BM25 for maximum relevance</small>
        </label>
    </div>

    <div class="form-check mode-radio px-3 py-2 mode-selector" data-mode="semantic">
        <input class="form-check-input" type="radio" name="sidebar_mode_select" id="semantic" {% if mode=="semantic"
            %}checked{% endif %} />
        <label class="form-check-label" for="semantic">
            <span class="mode-label">Semantic</span>
            <small class="mode-description">Meaning-based (vector) search</small>
        </label>
    </div>

    <div class="form-check mode-radio px-3 py-2 mode-selector" data-mode="keyword">
        <input class="form-check-input" type="radio" name="sidebar_mode_select" id="keyword" {% if mode=="keyword"
            %}checked{% endif %} />
        <label class="form-check-label" for="keyword">
            <span class="mode-label">Keyword (BM25)</span>
            <small class="mode-description">Traditional full-text matching</small>
        </label>
    </div>

    <!-- Performance Graph -->
    {% if graph_img %}
    <div class="mt-4 pt-3 border-top">
        <h5 class="mode-title mb-3"><i class="bi bi-graph-up me-2"></i> Performance</h5>
        <img src="data:image/png;base64,{{ graph_img }}" alt="Query Performance Graph" class="img-fluid rounded" />
    </div>
    {% endif %}
</div>
