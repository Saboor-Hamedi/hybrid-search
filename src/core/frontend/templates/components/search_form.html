<!-- Search Form Component -->
<div class="card search-card">
    <form method="GET" id="main-search-form">
        <div class="search-form-grid">
            <!-- Query Input -->
            <div class="input-group">
                <span class="input-group-text bg-white border-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" name="query" class="form-control border-0"
                    placeholder="Enter your search query..." value="{{ query }}" required autofocus />
            </div>


            <!-- Submit Button -->
            <button type="submit"
                class="btn btn-primary w-100 d-flex align-items-center justify-content-center">
                <span class="d-none d-md-inline"><i class="bi bi-search me-1"></i> Search</span>
                <span class="d-md-none"><i class="bi bi-search"></i></span>
            </button>
        </div>

        <!-- Hidden inputs -->
        <input type="hidden" id="selected-mode-input" name="mode" value="{{ mode }}" />
        <input type="hidden" name="page_size" value="10">
    </form>
</div>
