<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-header-actions d-flex gap-2 w-100">
      <button class="new-chat-btn flex-grow-1" onclick="startNewSession()">
        <i class="bi bi-trash3"></i> New Session
      </button>
      <button class="new-doc-btn" onclick="openCreateModal()" title="Create New Document">
        <i class="bi bi-file-earmark-plus"></i>
      </button>
    </div>
  </div>
  
  <div class="sidebar-content">
    <div class="sidebar-section">
      <h6>Operations</h6>
      <button class="sidebar-action-btn" onclick="startExport()" title="Export all documents to JSON">
          <i class="bi bi-download"></i>
          <span>Export Database</span>
      </button>
    </div>

    <div class="sidebar-section mt-4 mb-4">
      <h6 class="text-muted small">System Health</h6>
      {% include 'components/_telemetry.html' %}
    </div>

  </div>

  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="sidebar-user-avatar">SH</div>
      <span class="user-name">Saboor Hamedi</span>
      <button class="btn-icon ms-auto" onclick="openSettings()">
          <i class="bi bi-gear"></i>
      </button>
    </div>
  </div>
</aside>
