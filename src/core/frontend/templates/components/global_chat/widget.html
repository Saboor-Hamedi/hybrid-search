<div id="global-chat-widget">
    <!-- Chat Container -->
    <div id="gc-container">
        <!-- Header -->
        <div class="gc-header">
            <div class="gc-header-title">
                <i class="bi bi-robot"></i>
                <span>AI Assistant</span>
                <div class="gc-status-dot" title="Online"></div>
            </div>
            <button class="btn text-white btn-sm p-0" onclick="toggleGlobalChat()">
                <i class="bi bi-dash-lg"></i>
            </button>
        </div>

        <!-- Messages Flow -->
        <div class="gc-messages" id="gc-messages">
            <div class="gc-message bot">
                Hello! I'm your standalone AI assistant. How can I help you today?
            </div>
            <!-- Typing Indicator -->
            <div class="gc-typing" id="gc-typing">
                <div class="gc-typing-dots">
                    <div class="gc-dot"></div>
                    <div class="gc-dot"></div>
                    <div class="gc-dot"></div>
                </div>
            </div>
        </div>

        <!-- Input Footer -->
        <div class="gc-footer">
            <div class="gc-input-wrapper">
                <textarea id="gc-input" rows="1" placeholder="Type a message..." spellcheck="false"></textarea>
                <button id="gc-send-btn" onclick="sendGlobalMessage()">
                    <i class="bi bi-arrow-up"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toggle Button -->
    <button id="gc-toggle-btn" onclick="toggleGlobalChat()">
        <i class="bi bi-chat-dots-fill icon-chat"></i>
        <i class="bi bi-x-lg icon-close"></i>
    </button>
</div>
