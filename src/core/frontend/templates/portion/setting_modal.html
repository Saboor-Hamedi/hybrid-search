<div class="modal-backdrop-custom" id="settingModal" style="display: none;">

        <div class="modal-footer-custom justify-content-end">

            <button class="btn btn-sm btn-dark" onclick="document.getElementById('settingModal').style.display='none'">Save Changes</button>
