<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Not Found – Hybrid Search</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f8f9fa; padding:3rem; text-align:center; }
    .card { max-width:500px; margin:auto; }
  </style>
</head>
<body>
  <div class="card p-4">
    <h1 class="text-danger">Document Not Found</h1>
    <p class="lead">
      Sorry, document <strong>{{ doc_id }}</strong> doesn't exist.
    </p>
    <p class="text-muted">{{ error }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary">Back to Search</a>
  </div>
</body>
</html>
