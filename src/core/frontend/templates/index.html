<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hybrid Search Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f9fafb; padding: 30px; }
    .card { margin-top: 15px; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
    .highlight { background: #f4f4f4; padding: 8px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">🧠 Hybrid Search Dashboard</h2>

    <form method="POST" class="mb-4">
      <div class="input-group">
        <input type="text" name="query" value="{{ query }}" class="form-control" placeholder="Enter your search query..." required>
        <button class="btn btn-primary" type="submit">Search</button>
      </div>
      <div class="form-check mt-2">
        <label>
    <input type="checkbox" name="use_hybrid" value="true"
           {% if use_hybrid %}checked{% endif %}> Use Hybrid (BM25 + Embedding)
  </label>

      </div>
    </form>

    {% if results %}
      <h5>🔍 {{ total }} results found.</h5>
      {% for r in results %}
        <div class="card p-3">
          <p class="highlight">{{ r.content }}</p>
          <small class="text-muted">
            <strong>Doc ID:</strong> {{ r.doc_id }} |
            <strong>Score:</strong> {{ "%.4f"|format(r.score) }} |
            <strong>Lang:</strong> {{ r.language }} |
            <strong>Created:</strong> {{ r.created_at }}
          </small>
        </div>
      {% endfor %}
    {% endif %}
  </div>
</body>
</html>
